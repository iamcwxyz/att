{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<h2>Edit Event</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label>{{ field.label }}</label>
                {% if field.name == 'courses' or field.name == 'years' %}
                {{ field }}
                {% else %}
                {% render_field field class="form-control" %}
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Update Event</button>
            <a href="{% url 'manage_events' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
