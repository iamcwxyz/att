{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<h2>Change Password</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label>{{ field.label }}</label>
                {% render_field field class="form-control" %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Change Password</button>
            <a href="{% url 'student_profile' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
